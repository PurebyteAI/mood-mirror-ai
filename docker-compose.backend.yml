services:
  backend:
    image: gcr.io/mood-backend-ai/backend
    container_name: mood-mirror-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      BACKEND_HOST: 0.0.0.0
      PORT: 8080
      BACKEND_PORT: 8080
      BACKEND_RELOAD: "false"
      SQLITE_DB_PATH: /data/mood_mirror.db
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - backend_data:/data
    ports:
      - "8080:8080"

volumes:
  backend_data:
