services:

  # ─────────────────────────────────────────────────────────────────────
  # Backend — FastAPI Web Service
  # URL will be: https://mood-mirror-backend.onrender.com
  # ─────────────────────────────────────────────────────────────────────
  - type: web
    name: mood-mirror-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    plan: free

    envVars:
      - key: BACKEND_RELOAD
        value: "false"

      # SQLite stored at /tmp — ephemeral (wiped on redeploy).
      # Upgrade to a Render Disk or PostgreSQL for persistent data.
      - key: SQLITE_DB_PATH
        value: /tmp/mood_mirror.db

      # Allow requests from the deployed frontend
      - key: CORS_ORIGINS
        value: https://mood-mirror-frontend.onrender.com

      # ── Groq (AI analysis + speech-to-text) ──────────────────────────
      - key: GROQ_API_KEY
        sync: false          # Set this in the Render dashboard
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1

      # ── Rime TTS ─────────────────────────────────────────────────────
      - key: RIME_API_KEY
        sync: false

      # ── LiveKit (Talk-to-Mirror voice AI) ────────────────────────────
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

      # ── Image generation ─────────────────────────────────────────────
      - key: IMAGE_API_URL
        value: https://image-api.aanuragtrivedi007.workers.dev
      - key: IMAGE_API_BEARER_TOKEN
        sync: false

  # ─────────────────────────────────────────────────────────────────────
  # Frontend — React Static Site
  # URL will be: https://mood-mirror-frontend.onrender.com
  # ─────────────────────────────────────────────────────────────────────
  - type: static
    name: mood-mirror-frontend
    rootDir: frontend
    buildCommand: yarn install && yarn build
    staticPublishPath: build

    # React Router: rewrite all paths to index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      # Must match the backend service name above
      - key: REACT_APP_BACKEND_URL
        value: https://mood-mirror-backend.onrender.com
