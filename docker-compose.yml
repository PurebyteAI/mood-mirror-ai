services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mood-mirror-backend
    restart: unless-stopped
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8001
      BACKEND_RELOAD: "false"
      SQLITE_DB_PATH: /data/mood_mirror.db
      # For local compose, frontend reaches backend through same origin via nginx proxy.
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      RIME_API_KEY: ${RIME_API_KEY:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      IMAGE_API_URL: ${IMAGE_API_URL:-}
      IMAGE_API_BEARER_TOKEN: ${IMAGE_API_BEARER_TOKEN:-}
    volumes:
      - backend_data:/data
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: /api
    container_name: mood-mirror-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  backend_data:
