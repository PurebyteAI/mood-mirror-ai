steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/${_IMAGE_NAME}
      - ./backend

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/${_IMAGE_NAME}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - gcr.io/$PROJECT_ID/${_IMAGE_NAME}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - '8080'
      - --update-env-vars
      - ^|^BACKEND_HOST=0.0.0.0|BACKEND_PORT=8080|BACKEND_RELOAD=false|SQLITE_DB_PATH=${_SQLITE_DB_PATH}|CORS_ORIGINS=${_CORS_ORIGINS}

images:
  - gcr.io/$PROJECT_ID/${_IMAGE_NAME}

substitutions:
  _IMAGE_NAME: backend
  _SERVICE_NAME: mood-mirror-backend
  _REGION: europe-west1
  _SQLITE_DB_PATH: /tmp/mood_mirror.db
  _CORS_ORIGINS: https://mood-mirror-frontend.onrender.com,http://localhost:3000,http://127.0.0.1:3000
